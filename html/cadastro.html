<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inf 25B — Acesso</title>
    <link rel="stylesheet" href="../css/backGround.css" />
    <link rel="stylesheet" href="../css/cadastro.css" />
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inf 25B" />
    <link rel="apple-touch-icon" href="../assets/logo.png" />
    <link rel="icon" type="image/png" href="../assets/icon.png" />
    <!-- vercel analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>

    <div class="page" id="page">

        <!-- header sem fundo -->
        <header class="header">
            <div class="header-esquerda">
                <div class="logo"><img src="../assets/logo.png" alt="Logo da Inf 25B"></div>
                <span class="header-titulo">Inf 25B</span>
            </div>
        </header>

        <div class="centro">
            <div class="form-card">

                <h1 class="form-titulo" id="formTitulo"></h1>

                <form id="formPrincipal" novalidate>
                    <div class="campos" id="campos"></div>

                    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 14px;">
                        <div class="alerta" id="alerta"></div>

                        <button class="btn-principal" type="submit">
                            <span id="btnLabel"></span>
                        </button>

                        <p class="link-troca">
                            <span id="linkTexto"></span><a id="linkAcao" role="button" tabindex="0"></a>
                        </p>
                    </div>
                </form>

            </div>
        </div>

    </div>

    <script src="../js/global.js"></script>
    <script src="../js/background.js"></script>
    <script src="../js/cadastro.js"></script>

</body>

</html>
