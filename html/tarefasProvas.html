<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Plataforma oficial da turma INF 25B.">
  <title>INF 25B — Provas e tarefas</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/app.png">
</head>
<body data-page="academico" data-title="Provas e tarefas" data-subtitle="Calendário, conteúdos e materiais por matéria">
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="appTopbar"></header>
      <main class="page-content" id="conteudo">
<div class="page-heading"><div><span class="eyebrow">Organização acadêmica</span><h2>Provas, tarefas e materiais</h2><p>Um calendário completo com filtros por matéria e tipo, além de uma biblioteca de recursos por disciplina.</p></div><div class="heading-actions"><button class="button" id="todayButton">Ir para hoje</button><a class="button primary" href="adm.html" id="academicAdminButton" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Novo item</a></div></div>
<div class="tabs" role="tablist"><button class="tab-button active" data-tab="calendar">Calendário geral</button><button class="tab-button" data-tab="provas">Provas</button><button class="tab-button" data-tab="tarefas">Tarefas</button><button class="tab-button" data-tab="materiais">Materiais</button></div>
<section class="tab-panel" data-panel="calendar"><div class="filter-bar"><div class="search-field"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="input" id="calendarSearch" type="search" placeholder="Buscar por matéria ou conteúdo"></div><select class="select" id="calendarTypeFilter"><option value="all">Todos os tipos</option><option value="prova">Provas</option><option value="tarefa">Tarefas</option><option value="evento">Eventos</option><option value="feriado">Datas importantes</option></select></div><div class="calendar-shell"><div class="calendar-card" id="academicCalendar"></div><aside class="day-agenda"><h3 id="selectedDayTitle">Agenda do dia</h3><div class="day-agenda-list" id="selectedDayList"></div></aside></div></section>
<section class="tab-panel" data-panel="provas" hidden><div class="filter-bar"><div class="search-field"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="input" id="examSearch" type="search" placeholder="Buscar prova"></div><div class="chips" id="examSubjectChips"></div></div><div class="cards-grid" id="examGrid"></div></section>
<section class="tab-panel" data-panel="tarefas" hidden><div class="filter-bar"><div class="search-field"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="input" id="taskSearch" type="search" placeholder="Buscar tarefa"></div><div class="chips" id="taskSubjectChips"></div></div><div class="cards-grid" id="taskGrid"></div></section>
<section class="tab-panel" data-panel="materiais" hidden><div class="filter-bar"><div class="search-field"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="input" id="materialSearch" type="search" placeholder="Buscar material"></div><select class="select" id="materialTypeFilter"><option value="all">Todos os formatos</option><option value="pdf">PDF</option><option value="resumo">Resumo</option><option value="slide">Slides</option><option value="video">Vídeo</option><option value="link">Link</option></select></div><div class="cards-grid" id="materialGrid"></div></section></main>
    </div>
  </div>
  <nav class="mobile-nav" id="mobileNav" aria-label="Navegação móvel"></nav>
  <script defer src="../js/app.js"></script>
  <script defer src="../js/academico.js"></script>

</html>
