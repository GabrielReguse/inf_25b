<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Plataforma oficial da turma INF 25B.">
  <title>INF 25B — Conversa</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/chat.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/app.png">
</head>
<body data-page="conversa" data-title="Conversa" data-subtitle="Chat geral e mensagens diretas">
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="appTopbar"></header>
      <main class="page-content chat-page-content" id="conteudo"><section class="chat-layout" id="chatLayout"><aside class="chat-sidebar"><div class="chat-sidebar-head"><div class="chat-sidebar-title"><h2>Conversas</h2><button class="icon-button" id="newConversationButton" type="button" aria-label="Nova conversa"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div><label class="chat-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="conversationSearch" type="search" placeholder="Buscar conversa"></label></div><div class="conversation-list" id="conversationList"></div></aside><section class="chat-main"><header class="chat-header"><div class="chat-header-info"><button class="icon-button chat-back" id="chatBack" type="button"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><span class="conversation-avatar" id="chatAvatar">25</span><div><strong id="chatTitle">Turma INF 25B</strong><span id="chatStatus">Conversa geral da turma</span></div></div><button class="icon-button" id="refreshMessages" type="button" aria-label="Atualizar mensagens"><svg viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg></button></header><div class="message-list" id="messageList"></div><footer class="typing-area"><div class="composer-reply" id="composerReply"><span id="composerReplyText"></span><button class="icon-button" id="cancelReply" type="button"><svg viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></svg></button></div><div class="composer"><button class="composer-button" id="attachButton" type="button" aria-label="Anexar imagem"><svg viewBox="0 0 24 24"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.6-9.6a4 4 0 0 1 5.7 5.7l-9.7 9.6a2 2 0 1 1-2.8-2.8l8.9-8.9"/></svg></button><button class="composer-button record" id="recordButton" type="button" aria-label="Gravar áudio"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg></button><textarea id="messageInput" rows="1" maxlength="4000" placeholder="Escreva uma mensagem"></textarea><button class="composer-button send" id="sendButton" type="button" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/></svg></button><input id="mediaInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden></div></footer></section></section></main>
    </div>
  </div>
  <nav class="mobile-nav" id="mobileNav" aria-label="Navegação móvel"></nav>
  <script defer src="../js/app.js"></script>
  <script defer src="../js/chat.js"></script>
</body>
</html>
